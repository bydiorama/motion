name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate entries and storyboards
        run: python3 tools/validate.py
      - name: Generated files are up to date
        run: |
          python3 tools/build_index.py
          python3 tools/build_showcase.py
          git diff --exit-code INDEX.md showcase/index.html

  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml playwright
      - name: Check every recipe
        run: |
          for f in $(find recipes -name '*.js' -not -path 'recipes/_lib/*'); do
            slug="${f#recipes/}"; python3 tools/check_recipe.py "${slug%.js}"
          done

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check, test, catalog up to date, films valid
        run: pnpm verify
      - name: Install and exercise the npm release tarball
        run: |
          consumer=$(mktemp -d)
          archive=$(npm pack --silent --pack-destination "$consumer" | tail -1)
          cd "$consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "./$archive"
          node --input-type=module -e "import { buildCatalog } from '@bydiorama/motion'; import { scene } from '@bydiorama/motion/build'; buildCatalog(); scene('opening', []);"
          cp node_modules/@bydiorama/motion/examples/builder.film.mjs .
          npx --no-install motion make builder.film.mjs
          npx --no-install motion validate builder.film.json
          npx --no-install motion build builder.film.json
          npx --no-install motion wizard --out wizard.html
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Catalog matches the library
        run: python3 tools/validate.py
